<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación de Usuario</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos básicos para el formulario de login */
        .login-container {
            background: #d66e0c;
            max-width: 350px;
            margin: 70px auto;
            padding: 32px 28px 28px 28px;
            border-radius: 14px;
            box-shadow: 0 6px 32px rgba(44, 62, 80, 0.10);
            border: 1px solid #0d0d0e;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .login-container h2 {
            text-align: center;
            color: #ffffff; /* Azul fuerte para mejor contraste y visibilidad */
            margin-bottom: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .login-container input {
            padding: 12px;
            border: 1.5px solid #000000;
            border-radius: 7px;
            font-size: 1em;
            background: #f8fafc;
        }
        .login-container input::placeholder {
            color: #222;           /* Color oscuro para mejor visibilidad */
            opacity: 1;            /* Totalmente visible */
            font-weight: 500;      /* Un poco más grueso */
            letter-spacing: 0.5px; /* Mejor lectura */
        }
        .login-container button {
            background: linear-gradient(90deg, #1976d2 100%);
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 1.08em;
            font-weight: 600;
            margin-top: 8px;
        }
        .login-container button:hover {
            background: linear-gradient(90deg, #1976d2 0%, #3949ab 100%);
        }
        .login-error {
            color: #d32f2f;
            text-align: center;
            font-size: 0.98em;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm" autocomplete="off">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <input type="password" id="contrasena" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
            <div id="loginError" class="login-error"></div>
        </form>
    </div>
    <script>
        // Usuario y contraseña de ejemplo (puedes cambiar estos valores)
        const USUARIO_VALIDO = "admin";
        const CONTRASENA_VALIDA = "1234";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (usuario === USUARIO_VALIDO && contrasena === CONTRASENA_VALIDA) {
                // Autenticación exitosa, redirige a la página principal
                window.location.href = "index.html";
            } else {
                errorDiv.textContent = "Usuario o contraseña incorrectos.";
            }
        });
    </script>
</body>
</html>
