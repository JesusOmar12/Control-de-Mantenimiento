<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación de Usuario</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="Usuario.html"></script>
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm" autocomplete="off">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <input type="password" id="contrasena" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
            <div id="loginError" class="login-error"></div>
        </form>
    </div>
    <script>
        // Usuario y contraseña de ejemplo (puedes cambiar estos valores)
        const USUARIO_VALIDO = "admin";
        const CONTRASENA_VALIDA = "1234";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (usuario === USUARIO_VALIDO && contrasena === CONTRASENA_VALIDA) {
                // Autenticación exitosa, redirige a la página principal
                window.location.href = "index.html";
            } else {
                errorDiv.textContent = "Usuario o contraseña incorrectos.";
            }
        });
    </script>
</body>
</html>
