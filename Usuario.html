<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación de Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container" id="loginContainer">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm" autocomplete="off">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <input type="password" id="contrasena" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
            <div id="loginError" class="login-error"></div>
        </form>
        <span class="toggle-link" id="showRegister">¿No tienes cuenta? Regístrate</span>
    </div>
    <div class="login-container" id="registerContainer">
        <h2>Registrar Usuario</h2>
        <form id="registerForm" autocomplete="off">
            <input type="text" id="nuevoUsuario" placeholder="Nuevo usuario" required>
            <input type="password" id="nuevaContrasena" placeholder="Nueva contraseña" required>
            <button type="submit">Registrar</button>
            <div id="registerError" class="login-error"></div>
            <div id="registerSuccess"></div>
        </form>
        <span class="toggle-link" id="showLogin">¿Ya tienes cuenta? Inicia sesión</span>
    </div>
    
</body>
</html>
